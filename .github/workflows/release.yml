name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fixed-width, date-based version: 2026.0921.00012 (year.MMDD.run number).
      # - Always increases, so userscript managers see every release as an update.
      # - Zero-padded, so GitHub's release list (which orders these tags as text)
      #   shows them in the right order; managers compare parts as numbers.
      - name: Compute version
        run: echo "VERSION=$(date -u +%Y.%m%d).$(printf '%05d' ${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-${{ env.VERSION }}
          path: dist/

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Toolkit ${{ env.VERSION }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/toolkit.user.js
            dist/toolkit.meta.js